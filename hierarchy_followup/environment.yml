# Environment of the hierarchy follow-up tree (phase 3). Same name as the release environment.yml of
# lamm-mit/graphene-agent so that the memo's Section 9 commands apply verbatim.
#
# Difference to the release file (2026-09-23, tested on the M4 Max): numpy, scipy and matplotlib come from pip, not
# conda-forge. The conda-forge builds link OpenBLAS against llvm-openmp, while the pip wheel of torch bundles its own
# libomp; loading both in one process aborts with "OMP: Error #15" (duplicate OpenMP runtime), and the documented
# workaround (KMP_DUPLICATE_LIB_OK) is explicitly unsafe. With everything numeric from pip only one OpenMP runtime is
# loaded. Atomistica (Fortran reference, needed by validation/ and by three pytest cases) installs from a prebuilt
# macOS-arm64 wheel; no compiler is needed.
name: graphene-agent
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ffmpeg
  - ghostscript
  - pip
  - pip:
      - numpy>=2.0
      - scipy>=1.13
      - matplotlib>=3.9
      - torch>=2.7
      - ase>=3.23
      - atomistica>=1.2.7
      - fastapi>=0.115
      - uvicorn>=0.34
      - pydantic>=2
      - pytest>=8
      - pymupdf>=1.24
      - huggingface_hub>=0.25
