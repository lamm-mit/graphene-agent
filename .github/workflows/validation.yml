name: Core and release checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pytest carbon_discovery/tests -q
      - run: python -m pytest hierarchy_followup/tests/test_followup.py tests_release -q
      # Atomistica reference tests skip when the optional reference is unavailable.
      # The recorded local release validation includes these reference checks.
